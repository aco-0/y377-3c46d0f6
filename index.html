async function open(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.normalize('NFC')),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:300000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['decrypt']);
 const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c)));
 try{localStorage.setItem('y377pw',pw)}catch(e){}
 document.open();document.write(t);document.close();}
